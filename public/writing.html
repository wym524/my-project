<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>写作练习 - 雅思学习空间</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="page-container">
    <div class="page-topbar">
      <div class="brand">📚 雅思学习空间</div>
      <div class="right-group">
        <span id="username" class="username"></span>
        <button class="logout-btn" onclick="logout()">退出登录</button>
      </div>
    </div>

    <div style="margin-bottom: 12px;"><a id="backBtn" href="dashboard.html" style="display:inline-block;padding:8px 16px;background:#2563eb;color:#fff;border-radius:6px;text-decoration:none;font-size:14px;">← 返回首页</a></div>
    <h1 class="page-title">✍️ 写作练习</h1>
    <p class="page-subtitle">大作文与小作文训练，范文参考与 AI 批改</p>

    <div class="filter-bar">
      <label><strong>作文类型:</strong></label>
      <select id="typeFilter" onchange="loadWritings()">
        <option value="">全部</option>
        <option value="大作文">大作文 (Task 2)</option>
        <option value="小作文">小作文 (Task 1)</option>
      </select>
      <button class="btn-secondary btn-sm" onclick="window.location.href='dashboard.html'">返回主页</button>
      <button id="seedBtn" class="btn-sm" style="margin-left:12px;padding:6px 12px;background:#f59e0b;color:#fff;border:none;border-radius:6px;cursor:pointer;" onclick="seedWritings()">📥 导入题库</button>
      <button id="aiBtnWriting" class="btn-sm" style="padding:6px 12px;background:#f472b6;color:#fff;border:none;border-radius:6px;cursor:pointer;" onclick="aiGenerate()">🤖 AI 生成内容</button>
    </div>
    <div id="genStatus" style="margin:8px 0;padding:8px 12px;display:none;background:#fef3c7;color:#92400e;border-radius:6px;font-size:13px;"></div>

    <div class="split-layout">
      <div class="list-panel">
        <div class="section-title" style="margin-bottom:12px; font-size:15px;">题目列表</div>
        <div id="writingList" style="max-height:65vh; overflow-y:auto;">
          <div class="loading-text">加载中...</div>
        </div>
      </div>

      <div class="detail-panel">
        <div id="writingDetail">
          <div class="empty-state" style="text-align:center; padding:60px 20px;">
            <div style="font-size:48px; margin-bottom:12px;">👈</div>
            <p>请从左侧选择一个写作题目开始练习</p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    let writings = [];
    let currentWriting = null;
    let currentUser = null;

    function checkAuth() {
      fetch('/api/me').then(r => r.json()).then(data => {
        if (!data.username) { window.location.href = 'login.html'; return; }
        currentUser = data;
        document.getElementById('username').textContent = '👋 ' + data.username;
        const bb = document.getElementById('backBtn');
        if (bb) {
          if (data.role === 'admin') {
            bb.href = 'admin.html';
            bb.textContent = '← 管理员主页';
            bb.style.background = '#7c3aed';
          } else {
            bb.href = 'dashboard.html';
            bb.textContent = '← 返回首页';
            bb.style.background = '#2563eb';
          }
        }
        loadWritings();
      }).catch(() => { window.location.href = 'login.html'; });
    }

    function logout() {
      fetch('/api/logout', { method: 'POST' }).then(() => { window.location.href = 'login.html'; });
    }

    function loadWritings() {
      const type = document.getElementById('typeFilter').value;
      let url = '/api/writing';
      if (type) url += '?type=' + encodeURIComponent(type);
      fetch(url).then(r => r.json()).then(res => {
        if (res.success) {
          writings = res.data || [];
          renderList();
        }
      });
    }

    function renderList() {
      const container = document.getElementById('writingList');
      if (writings.length === 0) {
        container.innerHTML = '<div class="empty-state">暂无题目</div>';
        return;
      }
      container.innerHTML = writings.map((w, idx) => `
        <div class="list-item ${currentWriting && currentWriting.id === w.id ? 'active' : ''}" onclick="selectWriting(${idx})" style="cursor:pointer; padding:12px; margin-bottom:6px; border-radius:8px;">
          <span style="background:${w.type === '大作文' ? '#fee2e2' : '#dbeafe'}; color:${w.type === '大作文' ? '#991b1b' : '#1e40af'}; font-size:11px; padding:2px 8px; border-radius:4px; font-weight:500; display:inline-block; margin-bottom:6px;">${w.type || '写作'}</span>
          <div style="font-size:14px; color:#1f2937; font-weight:500; line-height:1.5; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;">${escapeHtml(w.prompt)}</div>
        </div>
      `).join('');
    }

    function selectWriting(idx) {
      currentWriting = writings[idx];
      renderList();
      renderWritingDetail();
    }

    function renderWritingDetail() {
      const w = currentWriting;
      const container = document.getElementById('writingDetail');

      let outlineHtml = '';
      if (w.sample_outline && (typeof w.sample_outline === 'object' || w.sample_outline.startsWith('{'))) {
        try {
          const outline = typeof w.sample_outline === 'object' ? w.sample_outline : JSON.parse(w.sample_outline);
          const keys = Object.keys(outline);
          if (keys.length > 0) {
            outlineHtml = `
              <div style="margin-top:20px;">
                <button onclick="toggleOutline()" style="background:#eef2ff; color:#4338ca; border:none; padding:10px 16px; border-radius:8px; font-size:14px; cursor:pointer; font-weight:500;">
                  📐 参考思路
                </button>
                <div id="outlineContent" style="margin-top:10px; padding:16px; background:#f9fafb; border-radius:8px; border-left:3px solid #f59e0b; color:#374151; font-size:14px; line-height:1.8; display:none;">
                  ${keys.map(k => `<div style="margin-bottom:8px;"><strong style="color:#92400e;">${escapeHtml(k)}:</strong> ${escapeHtml(outline[k])}</div>`).join('')}
                </div>
              </div>
            `;
          }
        } catch (e) {}
      } else if (typeof w.sample_outline === 'string' && w.sample_outline) {
        outlineHtml = `
          <div style="margin-top:20px;">
            <button onclick="toggleOutline()" style="background:#eef2ff; color:#4338ca; border:none; padding:10px 16px; border-radius:8px; font-size:14px; cursor:pointer; font-weight:500;">
              📐 参考思路
            </button>
            <div id="outlineContent" style="margin-top:10px; padding:16px; background:#f9fafb; border-radius:8px; border-left:3px solid #f59e0b; color:#374151; font-size:14px; line-height:1.8; display:none;">${escapeHtml(w.sample_outline)}</div>
          </div>
        `;
      }

      let sampleHtml = '';
      if (w.sample_essay) {
        sampleHtml = `
          <div style="margin-top:20px;">
            <button onclick="toggleSample()" style="background:#eef2ff; color:#4338ca; border:none; padding:10px 16px; border-radius:8px; font-size:14px; cursor:pointer; font-weight:500;">
              📝 参考范文
            </button>
            <div id="sampleContent" style="margin-top:10px; padding:16px; background:#f9fafb; border-radius:8px; border-left:3px solid #10b981; color:#374151; font-size:14px; line-height:1.8; display:none; white-space:pre-wrap;">${escapeHtml(w.sample_essay)}</div>
          </div>
        `;
      }

      container.innerHTML = `
        <div style="margin-bottom:16px;">
          <span style="background:${w.type === '大作文' ? '#fee2e2' : '#dbeafe'}; color:${w.type === '大作文' ? '#991b1b' : '#1e40af'}; font-size:12px; padding:4px 12px; border-radius:4px; font-weight:600; display:inline-block;">${w.type || '写作'}</span>
        </div>
        <h2 style="font-size:18px; font-weight:600; color:#1e3a8a; line-height:1.6; margin-bottom:16px;">${escapeHtml(w.prompt)}</h2>

        ${outlineHtml}
        ${sampleHtml}

        <div style="margin-top:24px;">
          <label style="font-size:14px; font-weight:600; color:#1f2937; display:block; margin-bottom:8px;">✍️ 请在下方输入您的作文:</label>
          <textarea id="userAnswer" rows="12" placeholder="Write your essay here..." style="width:100%; padding:14px 16px; border:1.5px solid #d1d5db; border-radius:8px; font-size:14px; outline:none; font-family:inherit; resize:vertical; line-height:1.8; transition:border-color 0.2s;" onfocus="this.style.borderColor='#3b82f6'" onblur="this.style.borderColor='#d1d5db'"></textarea>
          <div style="margin-top:16px; display:flex; gap:12px; flex-wrap:wrap;">
            <button id="aiBtnWritingEval" class="btn-primary" onclick="submitToAI()">🤖 AI 批改作文</button>
            <button class="btn-secondary" onclick="clearAnswer()">清空</button>
            <span id="wordCounter" style="color:#6b7280; font-size:13px; align-self:center; margin-left:auto;">字数: 0</span>
          </div>
          <div id="aiEvalResult" style="margin-top:16px;"></div>
        </div>
      `;

      const ta = document.getElementById('userAnswer');
      ta.addEventListener('input', updateWordCount);
    }

    function updateWordCount() {
      const ta = document.getElementById('userAnswer');
      if (ta) {
        const text = ta.value || '';
        const words = text.trim() ? text.trim().split(/\s+/).length : 0;
        const chars = text.length;
        document.getElementById('wordCounter').textContent = `字数: ${words} 词 / ${chars} 字符`;
      }
    }

    function toggleOutline() {
      const c = document.getElementById('outlineContent');
      if (c) c.style.display = c.style.display === 'none' ? 'block' : 'none';
    }

    function toggleSample() {
      const c = document.getElementById('sampleContent');
      if (c) c.style.display = c.style.display === 'none' ? 'block' : 'none';
    }

    function clearAnswer() {
      const ta = document.getElementById('userAnswer');
      if (ta) ta.value = '';
      document.getElementById('wordCounter').textContent = '字数: 0';
      document.getElementById('aiEvalResult').innerHTML = '';
    }

    async function submitToAI() {
      const btn = document.getElementById('aiBtnWritingEval') || document.querySelector('button[onclick="submitToAI()"]');
      const oldText = btn ? btn.textContent : '';
      if (btn) { btn.disabled = true; btn.textContent = '⏳ 批改中...'; btn.style.opacity = '0.6'; btn.style.cursor = 'not-allowed'; }
      
      const userAnswer = document.getElementById('userAnswer').value.trim();
      if (!userAnswer) {
        showToast('请先输入作文内容', 'info');
        if (btn) { btn.disabled = false; btn.textContent = oldText; btn.style.opacity = ''; btn.style.cursor = ''; }
        return;
      }
      document.getElementById('aiEvalResult').innerHTML = '<div style="padding:14px; background:#f0f9ff; border-radius:8px; text-align:center; color:#1e40af;">🤖 AI 正在批改中，请稍候...</div>';
      try {
        const r = await fetch('/api/ai/writing/evaluate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ topic: currentWriting ? currentWriting.prompt : '', answer: userAnswer })
        });
        const res = await r.json();
        if (res.success) {
          document.getElementById('aiEvalResult').innerHTML = `
            <div style="padding:18px; background:#ecfdf5; border-radius:10px; border-left:4px solid #10b981; color:#065f46; font-size:14px; line-height:1.8; white-space:pre-wrap;">
              <strong>✅ AI 批改结果:</strong>\n\n${escapeHtml(res.data ? res.data.evaluation : '完成')}
            </div>
          `;
          showToast('AI 批改完成！', 'success');
        } else {
          document.getElementById('aiEvalResult').innerHTML = `<div style="padding:14px; background:#fef2f2; border-radius:8px; color:#991b1b;">❌ ${escapeHtml(res.message || '批改失败')}</div>`;
        }
      } catch (err) {
        document.getElementById('aiEvalResult').innerHTML = `<div style="padding:14px; background:#fef2f2; border-radius:8px; color:#991b1b;">❌ 请求错误</div>`;
      } finally {
        if (btn) { btn.disabled = false; btn.textContent = oldText; btn.style.opacity = ''; btn.style.cursor = ''; }
      }
    }

    function escapeHtml(str) {
      if (str === null || str === undefined) return '';
      return String(str).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    function showToast(msg, type) {
      const t = document.createElement('div');
      t.className = 'toast ' + (type === 'success' ? 'toast-success' : (type === 'error' ? 'toast-error' : 'toast-info'));
      t.textContent = msg;
      document.body.appendChild(t);
      setTimeout(() => t.remove(), 2500);
    }

    function showGen(msg) {
      const s = document.getElementById('genStatus');
      if (msg) { s.style.display = 'block'; s.textContent = msg; }
      else { s.style.display = 'none'; }
    }

    async function aiGenerate() {
      const btn = document.getElementById('aiBtnWriting') || document.querySelector('button[onclick="aiGenerate()"]');
      const oldText = btn ? btn.textContent : '';
      if (btn) { btn.disabled = true; btn.textContent = '⏳ 处理中...'; btn.style.opacity = '0.6'; btn.style.cursor = 'not-allowed'; }
      
      const typeEl = document.getElementById('typeFilter');
      const type = typeEl ? typeEl.value : '大作文';
      showGen('🤖 正在调用 AI 生成' + type + '题目，请稍候...');
      try {
        const r = await fetch('/api/ai/generate-writing', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ type: type, count: 3 }) });
        const data = await r.json();
        if (data.success) {
          showGen('✅ 成功生成 ' + data.count + ' 道' + type + '题目！正在刷新...');
          setTimeout(() => { loadWritings(); showGen(''); }, 1500);
        } else {
          showGen('❌ ' + data.message);
          setTimeout(() => showGen(''), 4000);
        }
      } catch (e) {
        showGen('❌ 网络错误: ' + e.message);
        setTimeout(() => showGen(''), 4000);
      } finally {
        if (btn) { btn.disabled = false; btn.textContent = oldText; btn.style.opacity = ''; btn.style.cursor = ''; }
      }
    }

    // ---------- 导入题库 ----------
    function seedWritings() {
      const btn = document.getElementById('seedBtn');
      if (btn) { btn.disabled = true; btn.style.opacity = '0.6'; btn.style.cursor = 'not-allowed'; }
      showGen('📥 正在导入题库，请稍候...');
      fetch('/api/writing/seed', { method: 'POST' })
        .then(r => r.json())
        .then(res => {
          if (res.success) {
            const count = (res.imported !== undefined ? res.imported : (res.count || 0));
            showGen(`✅ 成功导入 ${count} 道题目！`);
            showToast(`成功导入 ${count} 道题目！`, 'success');
            setTimeout(() => { loadWritings(); showGen(''); }, 1500);
          } else {
            showGen('❌ ' + (res.message || '导入失败'));
            showToast(res.message || '导入失败', 'error');
            setTimeout(() => showGen(''), 4000);
          }
        })
        .catch(e => {
          showGen('❌ 请求失败: ' + e.message);
          showToast('请求失败', 'error');
          setTimeout(() => showGen(''), 4000);
        })
        .finally(() => {
          if (btn) { btn.disabled = false; btn.style.opacity = ''; btn.style.cursor = ''; }
        });
    }

    checkAuth();
  </script>
  <script src="notification.js"></script>
</body>
</html>
