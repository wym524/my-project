<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>背单词 - 雅思学习空间</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="page-container">
    <div class="page-topbar">
      <div class="brand">📚 雅思学习空间</div>
      <div class="right-group">
        <span id="username" class="username"></span>
        <button class="logout-btn" onclick="logout()">退出登录</button>
      </div>
    </div>

    <div style="margin-bottom: 12px;"><a id="backBtn" href="dashboard.html" style="display:inline-block;padding:8px 16px;background:#2563eb;color:#fff;border-radius:6px;text-decoration:none;font-size:14px;">← 返回首页</a></div>
    <h1 class="page-title">📖 背单词</h1>
    <p class="page-subtitle">分模块学习雅思高频词汇，掌握后可标记为"已掌握"</p>

    <div class="search-bar" style="margin-bottom: 12px;">
      <input type="text" id="wordSearch" placeholder="搜索单词或释义..." oninput="applyFilter()" style="width: 100%; padding: 10px 14px; font-size: 14px; border: 1px solid #d1d5db; border-radius: 8px; box-sizing: border-box;">
    </div>

    <div class="filter-bar">
      <label><strong>筛选分类:</strong></label>
      <select id="categoryFilter" onchange="applyFilter()">
        <option value="">全部</option>
        <option value="高频">高频</option>
        <option value="学术">学术</option>
        <option value="写作">写作</option>
        <option value="口语">口语</option>
        <option value="阅读">阅读</option>
        <option value="听力">听力</option>
        <option value="自然地理">自然地理</option>
        <option value="植物研究">植物研究</option>
        <option value="动物保护">动物保护</option>
        <option value="科技发明">科技发明</option>
        <option value="身心健康">身心健康</option>
        <option value="同义替换">同义替换</option>
        <option value="语法">语法</option>
        <option value="商务经济">商务经济</option>
        <option value="文化艺术">文化艺术</option>
      </select>
      <label style="margin-left:12px;">
        <input type="checkbox" id="showUnknown" onchange="applyFilter()"> 只看未掌握
      </label>
      <label style="margin-left:12px;">
        <input type="checkbox" id="showKnown" onchange="applyFilter()"> 只看已掌握
      </label>
      <button class="btn-secondary btn-sm" onclick="window.location.href='dashboard.html'">返回主页</button>
      <button id="aiBtnWords" class="btn-sm" style="margin-left:12px;padding:6px 12px;background:#f472b6;color:#fff;border:none;border-radius:6px;cursor:pointer;" onclick="aiGenerateWords()">🤖 AI 生成单词</button>
      <button id="testModeBtn" class="btn-sm" style="padding:6px 12px;background:#8b5cf6;color:#fff;border:none;border-radius:6px;cursor:pointer;" onclick="startTestMode()">🎯 测试模式</button>
      <button id="seedBtn" class="btn-sm" style="padding:6px 12px;background:#f59e0b;color:#fff;border:none;border-radius:6px;cursor:pointer;" onclick="seedWords()">📥 导入题库</button>
    </div>

    <div class="tag-filter-bar" id="tagFilterBar">
      <span class="tag-filter-label">快速筛选:</span>
    </div>

    <div id="genStatus" style="margin:8px 0;padding:8px 12px;display:none;background:#fef3c7;color:#92400e;border-radius:6px;font-size:13px;"></div>

    <div class="split-layout">
      <div class="list-panel" id="listPanel">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; padding:10px 12px; background:#f8fafc; border-radius:8px; font-size:13px;">
          <div style="color:#374151;"><span id="statKnown" style="color:#065f46; font-weight:600;">0</span> / <span id="statTotal" style="font-weight:600;">0</span> 已掌握</div>
          <div style="color:#6b7280;">掌握率: <span id="statRate" style="color:#2563eb; font-weight:600;">0%</span></div>
        </div>
        <div class="section-title" style="margin-bottom:12px; font-size:15px;">单词列表</div>
        <div id="wordList" style="max-height:65vh; overflow-y:auto;">
          <div class="loading-text">加载中...</div>
        </div>
        <div style="margin-top:12px; display:flex; gap:8px; flex-wrap:wrap;">
          <button class="btn-secondary btn-sm" onclick="prevWord()">← 上一个</button>
          <button class="btn-secondary btn-sm" onclick="nextWord()">下一个 →</button>
        </div>
      </div>

      <div class="detail-panel" id="detailPanel">
        <div id="wordDetail">
          <div class="empty-state" style="text-align:center; padding:60px 20px;">
            <div style="font-size:48px; margin-bottom:12px;">👈</div>
            <p>请从左侧选择一个单词开始学习</p>
          </div>
        </div>
        <div id="testPanel" style="display:none;">
          <div class="test-header">
            <div class="test-title">🎯 单词测试</div>
            <div class="test-progress-wrap">
              <div class="test-progress-bar">
                <div class="test-progress-fill" id="testProgressFill"></div>
              </div>
              <div class="test-progress-text" id="testProgressText">第 0 / 10 题</div>
            </div>
            <div class="test-score">得分: <span id="testScore">0</span></div>
          </div>
          <div id="testContent"></div>
          <div style="margin-top:20px; text-align:center;">
            <button class="btn-secondary btn-sm" onclick="exitTestMode()">🚪 退出测试</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    let words = [];
    let allWords = [];
    let knownIds = new Set();
    let currentIndex = 0;
    let currentUser = null;
    let availableCategories = [];

    function checkAuth() {
      fetch('/api/me').then(r => r.json()).then(data => {
        if (!data.username) { window.location.href = 'login.html'; return; }
        currentUser = data;
        document.getElementById('username').textContent = '👋 ' + data.username;
        const bb = document.getElementById('backBtn');
        if (bb) {
          if (data.role === 'admin') {
            bb.href = 'admin.html';
            bb.textContent = '← 管理员主页';
            bb.style.background = '#7c3aed';
          } else {
            bb.href = 'dashboard.html';
            bb.textContent = '← 返回首页';
            bb.style.background = '#2563eb';
          }
        }
        loadWords();
      }).catch(() => { window.location.href = 'login.html'; });
    }

    function logout() {
      fetch('/api/logout', { method: 'POST' }).then(() => { window.location.href = 'login.html'; });
    }

    function loadWords() {
      fetch('/api/words').then(r => r.json()).then(res => {
        if (res.success) {
          allWords = res.data || [];
          // 从数据中自动提取可用分类
          const cats = new Set();
          allWords.forEach(w => { if (w.category) cats.add(w.category); });
          availableCategories = Array.from(cats).sort();
          renderTagFilters();
          syncSelectOptions();
          applyFilter();
        }
      });
    }

    function syncSelectOptions() {
      // 同步下拉框选项（保持现有选中值）
      const sel = document.getElementById('categoryFilter');
      if (!sel) return;
      const currentVal = sel.value;
      const html = ['<option value="">全部</option>']
        .concat(availableCategories.map(c => `<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`))
        .join('');
      sel.innerHTML = html;
      if (availableCategories.includes(currentVal)) {
        sel.value = currentVal;
      }
    }

    function renderTagFilters() {
      const container = document.getElementById('tagFilterBar');
      if (!container) return;
      const currentCategory = document.getElementById('categoryFilter')?.value || '';
      const tagsHtml = ['<span class="tag-filter-label">快速筛选:</span>',
        `<span class="category-tag-item ${currentCategory === '' ? 'active' : ''}" data-category="">全部(${allWords.length})</span>`]
        .concat(availableCategories.map(cat => {
          const count = allWords.filter(w => w.category === cat).length;
          const isActive = currentCategory === cat ? 'active' : '';
          return `<span class="category-tag-item ${isActive}" data-category="${escapeHtml(cat)}">${escapeHtml(cat)}(${count})</span>`;
        }))
        .join('');
      container.innerHTML = tagsHtml;
      // 绑定点击事件
      container.querySelectorAll('.category-tag-item').forEach(tag => {
        tag.addEventListener('click', () => {
          const cat = tag.dataset.category || '';
          const sel = document.getElementById('categoryFilter');
          if (sel) sel.value = cat;
          // 重新渲染标签以更新 active
          renderTagFilters();
          applyFilter();
        });
      });
    }

    function applyFilter() {
      const category = document.getElementById('categoryFilter').value;
      const showOnlyUnknown = document.getElementById('showUnknown').checked;
      const showOnlyKnown = document.getElementById('showKnown').checked;
      const searchInput = document.getElementById('wordSearch');
      const keyword = searchInput ? searchInput.value.trim().toLowerCase() : '';

      let filtered = allWords;
      // 分类筛选
      if (category) {
        filtered = filtered.filter(w => w.category === category);
      }
      // 关键词搜索（单词或释义）
      if (keyword) {
        filtered = filtered.filter(w =>
          (w.word && w.word.toLowerCase().includes(keyword)) ||
          (w.meaning && w.meaning.toLowerCase().includes(keyword))
        );
      }
      // 掌握状态筛选
      if (showOnlyKnown) {
        filtered = filtered.filter(w => knownIds.has(w.id));
      } else if (showOnlyUnknown) {
        filtered = filtered.filter(w => !knownIds.has(w.id));
      }

      words = filtered;
      renderList();
      // 同步更新标签显示
      const activeCat = category;
      const container = document.getElementById('tagFilterBar');
      if (container) {
        container.querySelectorAll('.category-tag-item').forEach(tag => {
          const tagCat = tag.dataset.category || '';
          if (tagCat === activeCat) {
            tag.classList.add('active');
          } else {
            tag.classList.remove('active');
          }
        });
      }
      if (words.length > 0) {
        currentIndex = 0;
        showWord(words[0].id);
      } else {
        document.getElementById('wordDetail').innerHTML = '<div class="empty-state">没有可学习的单词（试试点击"导入题库"或调整筛选）</div>';
      }
    }

    function renderList() {
      const total = words.length;
      const knownCount = words.filter(w => knownIds.has(w.id)).length;
      const rate = total > 0 ? Math.round(knownCount * 100 / total) : 0;
      const sk = document.getElementById('statKnown');
      if (sk) sk.textContent = knownCount;
      const st = document.getElementById('statTotal');
      if (st) st.textContent = total;
      const sr = document.getElementById('statRate');
      if (sr) sr.textContent = rate + '%';
      const container = document.getElementById('wordList');
      if (words.length === 0) {
        container.innerHTML = '<div class="empty-state">暂无单词</div>';
        return;
      }
      container.innerHTML = words.map((w, idx) => {
        const known = knownIds.has(w.id);
        return `
        <div class="list-item ${currentIndex === idx ? 'active' : ''}" onclick="selectWord(${idx})" style="cursor:pointer; padding:10px 12px 10px 14px; margin-bottom:6px; border-radius:8px; transition:all 0.2s; border-left:4px solid ${known ? '#10b981' : '#d1d5db'};">
          <div style="display:flex; justify-content:space-between; align-items:center;">
            <div style="flex:1;">
              <div style="font-weight:600; color:#1e40af; font-size:15px;">${escapeHtml(w.word)}</div>
              <div class="item-sub" style="color:#6b7280; font-size:12px; margin-top:2px;">${escapeHtml(w.meaning)} ${w.category ? `<span style="background:#e0e7ff;color:#3730a3;padding:1px 6px;border-radius:4px;margin-left:4px;font-size:11px;">${escapeHtml(w.category)}</span>` : ''}</div>
            </div>
            <div style="font-size:18px; margin-left:8px;">${known ? '✅' : '⬜'}</div>
          </div>
        </div>
      `}).join('');
    }

    function selectWord(idx) {
      currentIndex = idx;
      showWord(words[idx].id);
      renderList();
    }

    let meaningVisible = true;

    function showWord(id) {
      const w = allWords.find(x => x.id === id);
      if (!w) return;
      meaningVisible = true;
      const container = document.getElementById('wordDetail');
      container.innerHTML = `
        <div class="word-card">
          <span class="category-badge">${escapeHtml(w.category || '通用')}</span>
          <div style="font-size:40px; font-weight:700; color:#1e40af; margin:16px 0 8px; letter-spacing:1px;">
            ${escapeHtml(w.word)}
          </div>
          <div style="margin-top:12px; display:flex; justify-content:center; gap:10px; flex-wrap:wrap;">
            <button class="pronounce-btn" onclick="playPronounce('${escapeHtml(w.word)}')">🔊 朗读</button>
            <button class="meaning-toggle-btn" onclick="toggleMeaning()" id="meaningBtn">📝 隐藏释义</button>
          </div>
          <div id="meaningSection" style="color:#4b5563; font-size:16px; margin-bottom:16px; margin-top:12px;">📘 ${escapeHtml(w.meaning)}</div>
          ${w.example ? `<div style="background:#f9fafb; padding:14px 18px; border-radius:8px; border-left:3px solid #3b82f6; color:#374151; font-style:italic; line-height:1.7; font-size:14px;">💬 "${escapeHtml(w.example)}"</div>` : ''}
          <div style="margin-top:24px; display:flex; gap:12px; justify-content:center; flex-wrap:wrap;">
            <button class="btn-primary pronounce-action-btn" onclick="playPronounce('${escapeHtml(w.word)}')">🔊 朗读</button>
            <button class="btn-success" onclick="markKnown(${w.id})">✅ 已掌握</button>
            <button class="btn-secondary" onclick="nextWord()">❌ 不认识</button>
          </div>
        </div>
        <div style="margin-top:16px; display:flex; justify-content:space-between; gap:12px;">
          <button class="btn-secondary" onclick="prevWord()">← 上一个</button>
          <span style="color:#6b7280; font-size:13px; align-self:center;">${currentIndex + 1} / ${words.length}</span>
          <button class="btn-secondary" onclick="nextWord()">下一个 →</button>
        </div>
      `;
    }

    function toggleMeaning() {
      meaningVisible = !meaningVisible;
      const meaningSection = document.getElementById('meaningSection');
      const meaningBtn = document.getElementById('meaningBtn');
      if (meaningSection) {
        meaningSection.style.display = meaningVisible ? 'block' : 'none';
      }
      if (meaningBtn) {
        meaningBtn.textContent = meaningVisible ? '📝 隐藏释义' : '📝 查看释义';
      }
    }

    function playPronounce(word) {
      if ('speechSynthesis' in window) {
        const u = new SpeechSynthesisUtterance(word);
        u.lang = 'en-US';
        u.rate = 0.9;
        window.speechSynthesis.speak(u);
      } else {
        showToast('您的浏览器不支持语音朗读', 'info');
      }
    }

    function markKnown(id) {
      fetch('/api/words/' + id + '/known', { method: 'POST' })
        .then(r => r.json()).then(res => {
          if (res.success) {
            knownIds.add(id);
            showToast('已标记为掌握 ✓', 'success');
            applyFilter();
          } else {
            showToast(res.message || '操作失败', 'error');
          }
        });
    }

    function prevWord() {
      if (words.length === 0) return;
      currentIndex = (currentIndex - 1 + words.length) % words.length;
      showWord(words[currentIndex].id);
      renderList();
    }

    function nextWord() {
      if (words.length === 0) return;
      currentIndex = (currentIndex + 1) % words.length;
      showWord(words[currentIndex].id);
      renderList();
    }

    function showToast(msg, type) {
      const t = document.createElement('div');
      t.className = 'toast ' + (type === 'success' ? 'toast-success' : (type === 'error' ? 'toast-error' : 'toast-info'));
      t.textContent = msg;
      document.body.appendChild(t);
      setTimeout(() => t.remove(), 2500);
    }

    function showGen(msg) {
      const s = document.getElementById('genStatus');
      if (msg) { s.style.display = 'block'; s.textContent = msg; }
      else { s.style.display = 'none'; }
    }

    function escapeHtml(str) {
      if (str === null || str === undefined) return '';
      return String(str).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    async function aiGenerateWords() {
      const btn = document.getElementById('aiBtnWords');
      const oldText = btn ? btn.textContent : '';
      if (btn) { btn.disabled = true; btn.textContent = '⏳ 生成中...'; btn.style.opacity = '0.6'; btn.style.cursor = 'not-allowed'; }

      const cat = document.getElementById('categoryFilter').value || '高频';
      showGen('🤖 正在调用 AI 生成' + cat + '类单词，请稍候...');

      try {
        const r = await fetch('/api/ai/generate-words', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ category: cat, count: 10 }) });
        const data = await r.json();
        if (data.success) {
          showGen('✅ 成功生成 ' + (data.count || '若干') + ' 个' + cat + '单词！正在刷新列表...');
          setTimeout(() => { loadWords(); showGen(''); }, 1500);
        } else {
          showGen('❌ ' + data.message);
          setTimeout(() => showGen(''), 4000);
        }
      } catch (e) {
        showGen('❌ 网络错误: ' + e.message);
        setTimeout(() => showGen(''), 4000);
      } finally {
        if (btn) { btn.disabled = false; btn.textContent = oldText; btn.style.opacity = ''; btn.style.cursor = ''; }
      }
    }

    // ---------- 测试模式 ----------
    let testQuestions = [];
    let testIndex = 0;
    let testScore = 0;
    let inTestMode = false;

    function startTestMode() {
      if (words.length < 4) {
        showToast('当前筛选的单词不足，无法开始测试（至少需要4个）', 'error');
        return;
      }
      inTestMode = true;
      const pool = words.slice();
      shuffleArray(pool);
      const numQuestions = Math.min(10, pool.length);
      testQuestions = pool.slice(0, numQuestions).map(q => {
        const distractors = allWords
          .filter(w => w.id !== q.id && w.meaning !== q.meaning)
          .slice();
        shuffleArray(distractors);
        const options = [q.meaning];
        const seen = new Set([q.meaning]);
        for (const d of distractors) {
          if (seen.has(d.meaning)) continue;
          options.push(d.meaning);
          seen.add(d.meaning);
          if (options.length === 4) break;
        }
        while (options.length < 4) {
          const fake = '选项 ' + options.length;
          options.push(fake);
        }
        shuffleArray(options);
        return { word: q, options };
      });
      testIndex = 0;
      testScore = 0;
      document.getElementById('wordDetail').style.display = 'none';
      document.getElementById('testPanel').style.display = 'block';
      document.getElementById('testScore').textContent = '0';
      renderTestQuestion();
    }

    function renderTestQuestion() {
      if (testIndex >= testQuestions.length) {
        finishTest();
        return;
      }
      const q = testQuestions[testIndex];
      const progress = ((testIndex) / testQuestions.length) * 100;
      document.getElementById('testProgressFill').style.width = progress + '%';
      document.getElementById('testProgressText').textContent = `第 ${testIndex + 1} / ${testQuestions.length} 题`;
      const content = document.getElementById('testContent');
      content.innerHTML = `
        <div class="test-word-card">
          <div class="test-word">${escapeHtml(q.word.word)}</div>
          <div class="test-question-text">请选择这个单词的正确释义：</div>
          <div class="test-options" id="testOptions">
            ${q.options.map((opt, i) => `
              <button class="test-option" onclick="answerTest(${i})">
                <span class="test-option-label">${String.fromCharCode(65 + i)}</span>
                <span class="test-option-text">${escapeHtml(opt)}</span>
              </button>
            `).join('')}
          </div>
          <div id="testFeedback" style="display:none; margin-top:20px;"></div>
        </div>
      `;
    }

    function answerTest(idx) {
      const q = testQuestions[testIndex];
      const correct = q.word.meaning;
      const isCorrect = q.options[idx] === correct;
      const options = document.querySelectorAll('.test-option');
      options.forEach((btn, i) => {
        btn.disabled = true;
        if (q.options[i] === correct) {
          btn.classList.add('test-option-correct');
        } else if (i === idx) {
          btn.classList.add('test-option-wrong');
        } else {
          btn.classList.add('test-option-disabled');
        }
      });
      if (isCorrect) {
        testScore++;
        document.getElementById('testScore').textContent = testScore;
      }
      const feedback = document.getElementById('testFeedback');
      feedback.style.display = 'block';
      feedback.innerHTML = `
        <div class="test-feedback-box ${isCorrect ? 'test-feedback-correct' : 'test-feedback-wrong'}">
          <div class="test-feedback-title">${isCorrect ? '✅ 回答正确！' : '❌ 回答错误'}</div>
          <div class="test-feedback-meaning"><strong>正确释义：</strong>${escapeHtml(correct)}</div>
          ${q.word.example ? `<div class="test-feedback-example"><strong>例句：</strong>${escapeHtml(q.word.example)}</div>` : ''}
          <button class="btn-primary btn-sm" onclick="nextTestQuestion()" style="margin-top:12px;">${testIndex + 1 >= testQuestions.length ? '查看结果' : '下一题 →'}</button>
        </div>
      `;
    }

    function nextTestQuestion() {
      testIndex++;
      if (testIndex >= testQuestions.length) {
        finishTest();
      } else {
        renderTestQuestion();
      }
    }

    function finishTest() {
      const progress = (testIndex / testQuestions.length) * 100;
      document.getElementById('testProgressFill').style.width = progress + '%';
      document.getElementById('testProgressText').textContent = `完成 ${testQuestions.length} / ${testQuestions.length} 题`;
      const content = document.getElementById('testContent');
      const percentage = Math.round(testScore * 100 / testQuestions.length);
      let emoji = '😅';
      if (percentage >= 90) emoji = '🏆';
      else if (percentage >= 70) emoji = '🎉';
      else if (percentage >= 50) emoji = '💪';
      content.innerHTML = `
        <div class="test-result-card">
          <div class="test-result-emoji">${emoji}</div>
          <div class="test-result-title">测试完成！</div>
          <div class="test-result-score">${testScore} / ${testQuestions.length} 题</div>
          <div class="test-result-rate">正确率：${percentage}%</div>
          <div style="margin-top:20px; display:flex; gap:12px; justify-content:center; flex-wrap:wrap;">
            <button class="btn-primary btn-sm" onclick="startTestMode()">🔁 再来一次</button>
            <button class="btn-secondary btn-sm" onclick="exitTestMode()">📚 返回学习</button>
          </div>
        </div>
      `;
    }

    function exitTestMode() {
      inTestMode = false;
      document.getElementById('testPanel').style.display = 'none';
      document.getElementById('wordDetail').style.display = 'block';
    }

    function shuffleArray(arr) {
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
    }

    // ---------- 导入题库 ----------
    function seedWords() {
      const btn = document.getElementById('seedBtn');
      if (btn) { btn.disabled = true; btn.style.opacity = '0.6'; btn.style.cursor = 'not-allowed'; }
      showGen('📥 正在导入题库，请稍候...');
      fetch('/api/words/seed', { method: 'POST' })
        .then(r => r.json())
        .then(res => {
          if (res.success) {
            const count = (res.imported !== undefined ? res.imported : (res.count || 0));
            showGen(`✅ 成功导入 ${count} 个单词！`);
            showToast(`成功导入 ${count} 个单词！`, 'success');
            setTimeout(() => { loadWords(); showGen(''); }, 1500);
          } else {
            showGen('❌ ' + (res.message || '导入失败'));
            showToast(res.message || '导入失败', 'error');
            setTimeout(() => showGen(''), 4000);
          }
        })
        .catch(e => {
          showGen('❌ 请求失败: ' + e.message);
          showToast('请求失败', 'error');
          setTimeout(() => showGen(''), 4000);
        })
        .finally(() => {
          if (btn) { btn.disabled = false; btn.style.opacity = ''; btn.style.cursor = ''; }
        });
    }

    checkAuth();
  </script>
  <script src="notification.js"></script>
</body>
</html>
