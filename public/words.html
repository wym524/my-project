<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>背单词 - 雅思学习空间</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="page-container">
    <div class="page-topbar">
      <div class="brand">📖 背单词</div>
      <div class="right-group">
        <a href="learning.html" style="color:#fff;font-size:13px;text-decoration:none;">← 返回学习空间</a>
        <span class="username" id="username">--</span>
        <button class="logout-btn" id="logoutBtn">退出登录</button>
      </div>
    </div>

    <div class="filter-bar">
      <div class="filter-item">
        <label>分类：</label>
        <select id="categorySelect">
          <option value="">全部</option>
          <option value="高频">高频</option>
          <option value="学术">学术</option>
          <option value="写作">写作</option>
          <option value="听力">听力</option>
          <option value="阅读">阅读</option>
          <option value="口语">口语</option>
        </select>
      </div>
      <div class="filter-item">
        <label>每页：</label>
        <select id="pageSizeSelect">
          <option value="10">10</option>
          <option value="20" selected>20</option>
          <option value="50">50</option>
          <option value="100">100</option>
        </select>
      </div>
      <button class="btn-primary btn-sm" id="applyBtn">应用筛选</button>
    </div>

    <div class="word-card" id="wordCard" style="display:none;">
      <span class="category-badge" id="wordCategory">--</span>
      <div class="word" id="wordText">--</div>
      <div class="phonetic" id="wordPhonetic">/ -- /</div>
      <div class="meaning" id="wordMeaning">--</div>
      <div class="example" id="wordExample">--</div>
      <div class="action-row">
        <button class="btn-danger" id="unknownBtn">❌ 不认识</button>
        <button class="btn-secondary" id="knownBtn">🤔 认识</button>
        <button class="btn-success" id="masteredBtn">✅ 已掌握</button>
      </div>
      <div class="nav-row">
        <button class="btn-secondary btn-sm" id="prevBtn">← 上一个</button>
        <button class="btn-secondary btn-sm" id="nextBtn">下一个 →</button>
      </div>
    </div>

    <div class="progress-wrap">
      <div class="progress-bar">
        <div class="progress-fill" id="progressFill" style="width:0%;"></div>
      </div>
      <div class="progress-text" id="progressText">0 / 0</div>
    </div>

    <div id="emptyPanel" class="panel" style="display:none;text-align:center;">
      <div class="empty-tip">暂无单词数据，请尝试其他筛选</div>
    </div>
  </div>

  <script>
    var usernameEl = document.getElementById('username');
    var logoutBtn = document.getElementById('logoutBtn');
    var categorySelect = document.getElementById('categorySelect');
    var pageSizeSelect = document.getElementById('pageSizeSelect');
    var applyBtn = document.getElementById('applyBtn');
    var wordCard = document.getElementById('wordCard');
    var wordText = document.getElementById('wordText');
    var wordCategory = document.getElementById('wordCategory');
    var wordMeaning = document.getElementById('wordMeaning');
    var wordExample = document.getElementById('wordExample');
    var prevBtn = document.getElementById('prevBtn');
    var nextBtn = document.getElementById('nextBtn');
    var unknownBtn = document.getElementById('unknownBtn');
    var knownBtn = document.getElementById('knownBtn');
    var masteredBtn = document.getElementById('masteredBtn');
    var progressFill = document.getElementById('progressFill');
    var progressText = document.getElementById('progressText');
    var emptyPanel = document.getElementById('emptyPanel');

    var words = [];
    var currentIndex = 0;

    function showToast(msg, type) {
      var t = document.createElement('div');
      t.className = 'toast toast-' + (type || 'info');
      t.textContent = msg;
      document.body.appendChild(t);
      setTimeout(function() { t.remove(); }, 2000);
    }

    fetch('/api/me')
      .then(function(r) {
        if (!r.ok) { window.location.href = '/login.html'; return null; }
        return r.json();
      })
      .then(function(data) {
        if (!data) return;
        if (!data.loggedIn) { window.location.href = '/login.html'; return; }
        usernameEl.textContent = data.username;
        loadWords();
      })
      .catch(function() { window.location.href = '/login.html'; });

    logoutBtn.addEventListener('click', function() {
      fetch('/api/logout', { method: 'POST' })
        .then(function() { window.location.href = '/login.html'; });
    });

    applyBtn.addEventListener('click', function() {
      currentIndex = 0;
      loadWords();
    });

    function loadWords() {
      var cat = categorySelect.value;
      var pageSize = Number(pageSizeSelect.value);
      var url = '/api/words?limit=' + pageSize;
      if (cat) url += '&category=' + encodeURIComponent(cat);

      fetch(url)
        .then(function(r) { return r.json(); })
        .then(function(data) {
          if (!data.success || !data.data || data.data.length === 0) {
            words = [];
            wordCard.style.display = 'none';
            emptyPanel.style.display = 'block';
            progressFill.style.width = '0%';
            progressText.textContent = '0 / 0';
            return;
          }
          words = data.data;
          emptyPanel.style.display = 'none';
          wordCard.style.display = 'block';
          if (currentIndex >= words.length) currentIndex = 0;
          renderWord();
        })
        .catch(function() {
          emptyPanel.style.display = 'block';
          emptyPanel.innerHTML = '<div class="empty-tip">加载失败</div>';
        });
    }

    function renderWord() {
      if (words.length === 0) return;
      var w = words[currentIndex];
      wordText.textContent = w.word || '';
      wordCategory.textContent = w.category || '未分类';
      wordMeaning.textContent = w.meaning || '';
      wordExample.textContent = w.example || '（暂无例句）';
      var pct = words.length > 0 ? Math.round(((currentIndex + 1) / words.length) * 100) : 0;
      progressFill.style.width = pct + '%';
      progressText.textContent = (currentIndex + 1) + ' / ' + words.length;
    }

    prevBtn.addEventListener('click', function() {
      if (words.length === 0) return;
      currentIndex = (currentIndex - 1 + words.length) % words.length;
      renderWord();
    });

    nextBtn.addEventListener('click', function() {
      if (words.length === 0) return;
      currentIndex = (currentIndex + 1) % words.length;
      renderWord();
    });

    unknownBtn.addEventListener('click', function() {
      if (words.length === 0) return;
      currentIndex = (currentIndex + 1) % words.length;
      renderWord();
      showToast('标记为需要复习', 'info');
    });

    knownBtn.addEventListener('click', function() {
      if (words.length === 0) return;
      currentIndex = (currentIndex + 1) % words.length;
      renderWord();
      showToast('已记录为认识', 'info');
    });

    masteredBtn.addEventListener('click', function() {
      if (words.length === 0) return;
      var word = words[currentIndex];
      fetch('/api/words/' + word.id + '/known', { method: 'POST' })
        .then(function(r) { return r.json(); })
        .then(function(data) {
          if (data.success) {
            showToast('已标记为已掌握 ✓', 'success');
          } else {
            showToast(data.message || '操作失败', 'error');
          }
          currentIndex = (currentIndex + 1) % words.length;
          renderWord();
        })
        .catch(function() {
          currentIndex = (currentIndex + 1) % words.length;
          renderWord();
          showToast('网络异常', 'error');
        });
    });
  </script>
</body>
</html>
