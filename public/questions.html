<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>真题练习 - 雅思学习空间</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="page-container">
    <div class="page-topbar">
      <div class="brand">✏️ 真题练习</div>
      <div class="right-group">
        <a href="learning.html" style="color:#fff;font-size:13px;text-decoration:none;">← 返回学习空间</a>
        <span class="username" id="username">--</span>
        <button class="logout-btn" id="logoutBtn">退出登录</button>
      </div>
    </div>

    <div class="filter-bar">
      <div class="filter-item">
        <label>模块：</label>
        <select id="moduleSelect">
          <option value="">全部</option>
          <option value="reading">阅读</option>
          <option value="listening">听力</option>
          <option value="writing">写作</option>
        </select>
      </div>
      <div class="filter-item">
        <label>题型：</label>
        <select id="typeSelect">
          <option value="">全部</option>
          <option value="choice">选择题</option>
          <option value="blank">填空题</option>
        </select>
      </div>
      <button class="btn-primary btn-sm" id="applyBtn">应用筛选</button>
    </div>

    <div id="questionArea">
      <div class="empty-tip">加载中...</div>
    </div>

    <div id="emptyPanel" class="panel" style="display:none;text-align:center;">
      <div class="empty-tip">暂无符合条件的题目</div>
    </div>

    <div class="panel" id="statsPanel" style="margin-top:20px;display:none;">
      <div class="section-title">📊 本次答题统计</div>
      <div class="stats-grid">
        <div class="stat-card"><div class="num" id="statTotal">0</div><div class="label">已答题数</div></div>
        <div class="stat-card"><div class="num" id="statCorrect">0</div><div class="label">答对</div></div>
        <div class="stat-card"><div class="num" id="statWrong">0</div><div class="label">答错</div></div>
        <div class="stat-card"><div class="num" id="statRate">0%</div><div class="label">正确率</div></div>
      </div>
      <div style="margin-top:16px;text-align:center;">
        <button class="btn-primary btn-sm" id="nextQuestionBtn">下一题 →</button>
      </div>
    </div>
  </div>

  <script>
    var usernameEl = document.getElementById('username');
    var logoutBtn = document.getElementById('logoutBtn');
    var moduleSelect = document.getElementById('moduleSelect');
    var typeSelect = document.getElementById('typeSelect');
    var applyBtn = document.getElementById('applyBtn');
    var questionArea = document.getElementById('questionArea');
    var emptyPanel = document.getElementById('emptyPanel');
    var statsPanel = document.getElementById('statsPanel');
    var statTotal = document.getElementById('statTotal');
    var statCorrect = document.getElementById('statCorrect');
    var statWrong = document.getElementById('statWrong');
    var statRate = document.getElementById('statRate');
    var nextQuestionBtn = document.getElementById('nextQuestionBtn');

    var questions = [];
    var currentIndex = 0;
    var answered = 0;
    var correctCount = 0;

    function showToast(msg, type) {
      var t = document.createElement('div');
      t.className = 'toast toast-' + (type || 'info');
      t.textContent = msg;
      document.body.appendChild(t);
      setTimeout(function() { t.remove(); }, 2000);
    }

    fetch('/api/me')
      .then(function(r) {
        if (!r.ok) { window.location.href = '/login.html'; return null; }
        return r.json();
      })
      .then(function(data) {
        if (!data) return;
        if (!data.loggedIn) { window.location.href = '/login.html'; return; }
        usernameEl.textContent = data.username;
        loadQuestions();
      })
      .catch(function() { window.location.href = '/login.html'; });

    logoutBtn.addEventListener('click', function() {
      fetch('/api/logout', { method: 'POST' })
        .then(function() { window.location.href = '/login.html'; });
    });

    applyBtn.addEventListener('click', function() {
      currentIndex = 0;
      loadQuestions();
    });

    nextQuestionBtn.addEventListener('click', function() {
      if (questions.length === 0) return;
      currentIndex = (currentIndex + 1) % questions.length;
      renderQuestion();
    });

    function loadQuestions() {
      var mod = moduleSelect.value;
      var tp = typeSelect.value;
      var url = '/api/questions?limit=100';
      if (mod) url += '&module=' + encodeURIComponent(mod);
      if (tp) url += '&type=' + encodeURIComponent(tp);

      fetch(url)
        .then(function(r) { return r.json(); })
        .then(function(data) {
          if (!data.success || !data.data || data.data.length === 0) {
            questions = [];
            questionArea.style.display = 'none';
            emptyPanel.style.display = 'block';
            statsPanel.style.display = 'none';
            return;
          }
          questions = data.data;
          emptyPanel.style.display = 'none';
          questionArea.style.display = 'block';
          statsPanel.style.display = 'block';
          if (currentIndex >= questions.length) currentIndex = 0;
          renderQuestion();
        })
        .catch(function() {
          questionArea.innerHTML = '<div class="empty-tip">加载失败</div>';
        });
    }

    function renderQuestion() {
      if (questions.length === 0) return;
      var q = questions[currentIndex];
      var moduleText = { reading: '阅读', listening: '听力', writing: '写作' }[q.module] || q.module;
      var typeText = { choice: '选择题', blank: '填空题' }[q.type] || q.type;

      var html = '<div class="question-card">';
      html += '<div class="q-meta">' +
        '<span class="tag tag-module">' + moduleText + '</span>' +
        '<span class="tag tag-type">' + typeText + '</span>' +
        '<span style="color:#6b7280;font-size:13px;">题目 ' + (currentIndex + 1) + '/' + questions.length + '</span>' +
        '</div>';
      html += '<div class="q-prompt">' + escapeHtml(q.prompt) + '</div>';

      if (q.type === 'choice' && q.options && q.options.length > 0) {
        html += '<div class="choice-options" id="choiceOptions">';
        for (var i = 0; i < q.options.length; i++) {
          var letter = String.fromCharCode(65 + i);
          html += '<button class="choice-option" data-idx="' + i + '">' +
            '<strong>' + letter + '.</strong> ' + escapeHtml(q.options[i]) + '</button>';
        }
        html += '</div>';
      } else {
        html += '<div class="blank-input-group">' +
          '<input type="text" class="blank-input" id="blankInput" placeholder="请输入答案..." />' +
          '<button class="btn-primary" id="submitAnswerBtn">提交答案</button>' +
          '</div>';
      }

      html += '<div id="answerResult"></div>';
      html += '</div>';
      questionArea.innerHTML = html;

      if (q.type === 'choice' && q.options && q.options.length > 0) {
        var btns = questionArea.querySelectorAll('.choice-option');
        btns.forEach(function(btn) {
          btn.addEventListener('click', function() {
            handleChoiceAnswer(Number(btn.getAttribute('data-idx')));
          });
        });
      } else {
        var submitBtn = document.getElementById('submitAnswerBtn');
        submitBtn.addEventListener('click', function() {
          var val = document.getElementById('blankInput').value.trim();
          if (!val) {
            showToast('请先输入答案', 'error');
            return;
          }
          handleBlankAnswer(val);
        });
      }

      updateStats();
    }

    function handleChoiceAnswer(idx) {
      var q = questions[currentIndex];
      var correctIdx = Number(q.answer);
      var btns = questionArea.querySelectorAll('.choice-option');
      btns.forEach(function(b) { b.disabled = true; });
      answered++;
      if (idx === correctIdx) {
        btns[idx].classList.add('correct');
        correctCount++;
      } else {
        btns[idx].classList.add('wrong');
        if (!isNaN(correctIdx) && correctIdx >= 0 && correctIdx < btns.length) {
          btns[correctIdx].classList.add('correct');
        }
      }
      submitAnswer(String(idx));
      showResult(idx === correctIdx, String.fromCharCode(65 + correctIdx), q.explanation);
      updateStats();
    }

    function handleBlankAnswer(val) {
      var q = questions[currentIndex];
      var isCorrect = val.toLowerCase() === String(q.answer || '').trim().toLowerCase();
      answered++;
      if (isCorrect) correctCount++;
      submitAnswer(val);
      showResult(isCorrect, q.answer, q.explanation);
      updateStats();
    }

    function submitAnswer(ans) {
      var q = questions[currentIndex];
      fetch('/api/questions/' + q.id + '/answer', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ answer: ans })
      }).catch(function() {});
    }

    function showResult(isCorrect, correctAnswer, explanation) {
      var resultEl = document.getElementById('answerResult');
      var html = '<div class="answer-result ' + (isCorrect ? 'correct-box' : 'wrong-box') + '">';
      html += '<div class="result-title">' + (isCorrect ? '✅ 回答正确！' : '❌ 回答错误') + '</div>';
      html += '<div class="result-answer"><strong>正确答案：</strong>' + escapeHtml(correctAnswer || '') + '</div>';
      if (explanation) {
        html += '<div class="result-explanation"><strong>解析：</strong>' + escapeHtml(explanation) + '</div>';
      }
      html += '</div>';
      resultEl.innerHTML = html;
    }

    function updateStats() {
      statTotal.textContent = answered;
      statCorrect.textContent = correctCount;
      statWrong.textContent = answered - correctCount;
      statRate.textContent = answered > 0 ? Math.round((correctCount / answered) * 100) + '%' : '0%';
    }

    function escapeHtml(s) {
      if (s == null) return '';
      return String(s).replace(/[&<>"']/g, function(c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    }
  </script>
</body>
</html>
