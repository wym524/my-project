<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>真题练习 - 雅思学习空间</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="page-container">
    <div class="page-topbar">
      <div class="brand">📚 雅思学习空间</div>
      <div class="right-group">
        <span id="username" class="username"></span>
        <button class="logout-btn" onclick="logout()">退出登录</button>
      </div>
    </div>

    <div style="margin-bottom: 12px;"><a href="dashboard.html" style="display:inline-block;padding:8px 16px;background:#2563eb;color:#fff;border-radius:6px;text-decoration:none;font-size:14px;">← 返回首页</a></div>
    <h1 class="page-title">📝 真题练习</h1>
    <p class="page-subtitle">雅思阅读、听力真题训练，选择题与填空题结合</p>

    <div class="filter-bar">
      <label><strong>模块:</strong></label>
      <select id="moduleFilter" onchange="loadQuestions()">
        <option value="">全部</option>
        <option value="reading">阅读</option>
        <option value="listening">听力</option>
      </select>
      <label style="margin-left:12px;"><strong>题型:</strong></label>
      <select id="typeFilter" onchange="loadQuestions()">
        <option value="">全部</option>
        <option value="choice">选择题</option>
        <option value="blank">填空题</option>
      </select>
      <button class="btn-secondary btn-sm" onclick="window.location.href='dashboard.html'">返回主页</button>
      <button class="btn-sm" style="margin-left:12px;padding:6px 12px;background:#f472b6;color:#fff;border:none;border-radius:6px;cursor:pointer;" onclick="aiGenerate()">🤖 AI 生成内容</button>
    </div>
    <div id="genStatus" style="margin:8px 0;padding:8px 12px;display:none;background:#fef3c7;color:#92400e;border-radius:6px;font-size:13px;"></div>

    <div id="questionsContainer">
      <div class="loading-text">加载题目中...</div>
    </div>
  </div>

  <script>
    let questions = [];
    let answeredIds = {};
    let currentUser = null;

    function checkAuth() {
      fetch('/api/me').then(r => r.json()).then(data => {
        if (!data.username) { window.location.href = 'login.html'; return; }
        currentUser = data;
        document.getElementById('username').textContent = '👋 ' + data.username;
        loadQuestions();
      }).catch(() => { window.location.href = 'login.html'; });
    }

    function logout() {
      fetch('/api/logout', { method: 'POST' }).then(() => { window.location.href = 'login.html'; });
    }

    function loadQuestions() {
      const mod = document.getElementById('moduleFilter').value;
      const type = document.getElementById('typeFilter').value;
      let url = '/api/questions';
      const params = [];
      if (mod) params.push('module=' + encodeURIComponent(mod));
      if (type) params.push('type=' + encodeURIComponent(type));
      if (params.length) url += '?' + params.join('&');
      fetch(url).then(r => r.json()).then(res => {
        if (res.success) {
          questions = res.data || [];
          renderQuestions();
        }
      });
    }

    function renderQuestions() {
      const container = document.getElementById('questionsContainer');
      if (questions.length === 0) {
        container.innerHTML = '<div class="empty-state">暂无题目，请调整筛选条件</div>';
        return;
      }
      container.innerHTML = questions.map((q, idx) => renderQuestion(q, idx)).join('');
    }

    function renderQuestion(q, idx) {
      const typeLabel = q.type === 'choice' ? '选择题' : (q.type === 'blank' ? '填空题' : '题目');
      const moduleLabel = q.module === 'reading' ? '阅读' : (q.module === 'listening' ? '听力' : q.module);
      const answered = answeredIds[q.id];

      let optionsHtml = '';
      if (q.type === 'choice' && q.options && q.options.length > 0) {
        optionsHtml = '<div class="choice-options" style="margin-top:16px;">' +
          q.options.map((opt, i) => {
            let cls = 'choice-option';
            if (answered) {
              const correctAns = String(q.answer).trim();
              if (String(i) === correctAns) cls += ' correct';
              else if (answered.choice === i) cls += ' wrong';
            }
            return `<button class="${cls}" onclick="answerChoice(${q.id}, ${i})" ${answered ? 'disabled' : ''}>
              <strong style="color:#1e40af;">${String.fromCharCode(65 + i)}.</strong> ${escapeHtml(opt)}
            </button>`;
          }).join('') +
          '</div>';
      } else if (q.type === 'blank') {
        optionsHtml = `
          <div style="margin-top:16px; display:flex; gap:10px; flex-wrap:wrap; align-items:center;">
            <input type="text" id="blank-${q.id}" class="blank-input" placeholder="请输入答案..." ${answered ? 'disabled' : ''} style="flex:1; min-width:200px; padding:10px 14px; border:1.5px solid #d1d5db; border-radius:8px; font-size:14px; outline:none;">
            <button class="btn-primary" onclick="answerBlank(${q.id})" ${answered ? 'disabled' : ''}>提交答案</button>
          </div>
        `;
      }

      let resultHtml = '';
      if (answered) {
        const correct = answered.correct;
        resultHtml = `
          <div class="answer-result ${correct ? 'correct-box' : 'wrong-box'}" style="margin-top:16px; padding:14px 18px; border-radius:8px; border-left:4px solid ${correct ? '#10b981' : '#ef4444'}; background:${correct ? '#ecfdf5' : '#fef2f2'};">
            <div style="font-weight:600; color:${correct ? '#065f46' : '#991b1b'}; margin-bottom:6px;">
              ${correct ? '✅ 回答正确！' : '❌ 回答错误'}
            </div>
            <div style="font-size:14px; color:#374151; margin-bottom:4px;">
              <strong>正确答案:</strong> ${escapeHtml(q.answer)}
            </div>
            ${answered.userAnswer !== undefined ? `<div style="font-size:14px; color:#374151; margin-bottom:4px;"><strong>你的答案:</strong> ${escapeHtml(answered.userAnswer)}</div>` : ''}
            ${q.explanation ? `<div style="font-size:13px; color:#4b5563; line-height:1.7; margin-top:8px; padding-top:8px; border-top:1px dashed rgba(0,0,0,0.1);"><strong>💡 解析:</strong> ${escapeHtml(q.explanation)}</div>` : ''}
          </div>
        `;
      }

      return `
        <div class="question-card" style="background:#fff; border-radius:14px; padding:24px; box-shadow:0 4px 20px rgba(0,0,0,0.06); margin-bottom:20px;">
          <div style="display:flex; gap:10px; margin-bottom:14px; flex-wrap:wrap;">
            <span style="background:#e0e7ff; color:#3730a3; font-size:12px; padding:3px 10px; border-radius:4px; font-weight:500;">${moduleLabel}</span>
            <span style="background:#fef3c7; color:#92400e; font-size:12px; padding:3px 10px; border-radius:4px; font-weight:500;">${typeLabel}</span>
            <span style="color:#6b7280; font-size:12px;">第 ${idx + 1} 题</span>
          </div>
          <div style="font-size:17px; line-height:1.8; color:#1f2937; font-weight:500;">${escapeHtml(q.prompt)}</div>
          ${optionsHtml}
          ${resultHtml}
        </div>
      `;
    }

    function answerChoice(qid, choiceIdx) {
      fetch('/api/questions/' + qid + '/answer', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ answer: choiceIdx })
      }).then(r => r.json()).then(res => {
        if (res.success) {
          answeredIds[qid] = { correct: res.correct, choice: choiceIdx, userAnswer: String.fromCharCode(65 + choiceIdx) };
          renderQuestions();
          showToast(res.correct ? '回答正确！' : '回答错误', res.correct ? 'success' : 'error');
        }
      });
    }

    function answerBlank(qid) {
      const val = document.getElementById('blank-' + qid).value.trim();
      if (!val) { showToast('请输入答案', 'info'); return; }
      fetch('/api/questions/' + qid + '/answer', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ answer: val })
      }).then(r => r.json()).then(res => {
        if (res.success) {
          answeredIds[qid] = { correct: res.correct, userAnswer: val };
          renderQuestions();
          showToast(res.correct ? '回答正确！' : '回答错误', res.correct ? 'success' : 'error');
        }
      });
    }

    function escapeHtml(str) {
      if (str === null || str === undefined) return '';
      return String(str).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    function showToast(msg, type) {
      const t = document.createElement('div');
      t.className = 'toast ' + (type === 'success' ? 'toast-success' : (type === 'error' ? 'toast-error' : 'toast-info'));
      t.textContent = msg;
      document.body.appendChild(t);
      setTimeout(() => t.remove(), 2500);
    }

    function showGen(msg) {
      const s = document.getElementById('genStatus');
      if (msg) { s.style.display = 'block'; s.textContent = msg; }
      else { s.style.display = 'none'; }
    }

    async function aiGenerate() {
      const subjectEl = document.getElementById('moduleFilter');
      const subjectValue = subjectEl ? subjectEl.value : 'reading';
      const subjectLabel = subjectValue === 'listening' ? '听力' : '阅读';
      showGen('🤖 正在调用 AI 生成' + subjectLabel + '题目，请稍候...');
      try {
        const r = await fetch('/api/ai/generate-questions', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ subject: subjectValue, count: 5 }) });
        const data = await r.json();
        if (data.success) {
          showGen('✅ 成功生成 ' + data.count + ' 道' + subjectLabel + '题目！正在刷新...');
          setTimeout(() => { loadQuestions(); showGen(''); }, 1500);
        } else {
          showGen('❌ ' + data.message);
          setTimeout(() => showGen(''), 4000);
        }
      } catch (e) {
        showGen('❌ 网络错误: ' + e.message);
        setTimeout(() => showGen(''), 4000);
      }
    }

    checkAuth();
  </script>
</body>
</html>
