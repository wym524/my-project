<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>管理后台 - 雅思学习空间</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="page-container">
    <div class="page-topbar">
      <div class="brand">📚 雅思学习空间 <span class="admin-badge-red" style="margin-left:10px;">管理员</span></div>
      <div class="right-group">
        <span class="username" id="username">--</span>
        <button class="logout-btn" id="logoutBtn">退出登录</button>
      </div>
    </div>

    <h2 class="page-title">管理员操作</h2>
    <p class="page-subtitle">管理学习内容和用户任务</p>

    <div class="module-grid">
      <a class="module-card" href="admin-tasks.html">
        <div class="icon">📋</div>
        <div class="mc-title">任务管理</div>
        <div class="mc-desc">创建学习任务，分配给用户，跟踪完成情况</div>
      </a>
      <a class="module-card" href="words.html">
        <div class="icon">📖</div>
        <div class="mc-title">单词模块</div>
        <div class="mc-desc">查看/添加/编辑单词库</div>
      </a>
      <a class="module-card" href="questions.html">
        <div class="icon">✏️</div>
        <div class="mc-title">真题模块</div>
        <div class="mc-desc">查看/添加/编辑真题题库</div>
      </a>
      <a class="module-card" href="speaking.html">
        <div class="icon">🎤</div>
        <div class="mc-title">口语模块</div>
        <div class="mc-desc">查看/添加口语话题</div>
      </a>
      <a class="module-card" href="writing.html">
        <div class="icon">📝</div>
        <div class="mc-title">写作模块</div>
        <div class="mc-desc">查看/添加写作题目</div>
      </a>
    </div>

    <h2 class="page-title" style="margin-top: 40px;">系统概览</h2>
    <div id="statsBox" class="stats-grid">
      <div class="loading-text">加载中...</div>
    </div>
  </div>

  <script>
    const usernameEl = document.getElementById('username');
    const logoutBtn = document.getElementById('logoutBtn');
    const statsBox = document.getElementById('statsBox');

    fetch('/api/me')
      .then(function(r) {
        if (!r.ok) { window.location.href = '/login.html'; return null; }
        return r.json();
      })
      .then(function(data) {
        if (!data || !data.loggedIn || data.role !== 'admin') {
          window.location.href = '/login.html';
          return;
        }
        usernameEl.textContent = data.username;
        loadStats();
      });

    function loadStats() {
      fetch('/api/stats')
        .then(r => r.ok ? r.json() : null)
        .then(data => {
          if (!data || !data.data) return;
          const d = data.data;
          const rate = d.answeredQuestions > 0 ? Math.round((d.correctQuestions / d.answeredQuestions) * 100) : 0;
          statsBox.innerHTML = `
            <div class="stat-card"><div class="num">${d.totalTasks || 0}</div><div class="label">总任务数</div></div>
            <div class="stat-card"><div class="num">${d.completedTasks || 0}</div><div class="label">已完成任务</div></div>
            <div class="stat-card"><div class="num">${d.knownWords || 0}</div><div class="label">已掌握单词</div></div>
            <div class="stat-card"><div class="num">${d.answeredQuestions || 0}</div><div class="label">完成题目</div></div>
            <div class="stat-card"><div class="num">${rate}%</div><div class="label">正确率</div></div>
          `;
        });
    }

    logoutBtn.addEventListener('click', function() {
      fetch('/api/logout', { method: 'POST' })
        .then(function() { window.location.href = '/login.html'; });
    });
  </script>
</body>
</html>
