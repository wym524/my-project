<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>雅思学习空间 - 学习主页</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="page-container">
    <div class="page-topbar">
      <div class="brand">📚 雅思学习空间</div>
      <div class="right-group">
        <span id="username" class="username"></span>
        <button class="logout-btn" onclick="logout()">退出登录</button>
      </div>
    </div>

    <div style="margin-bottom: 12px;"><a id="backBtn" href="dashboard.html" style="display:inline-block;padding:8px 16px;background:#2563eb;color:#fff;border-radius:6px;text-decoration:none;font-size:14px;">← 返回首页</a></div>
    <h1 class="page-title">学习空间</h1>
    <p class="page-subtitle">欢迎来到雅思学习空间，开始您的高效备考之旅！</p>

    <!-- 模块卡片 -->
    <h2 class="section-title">🎯 学习模块</h2>
    <div class="module-grid">
      <a href="words.html" class="module-card">
        <div class="icon">📖</div>
        <div class="mc-title">背单词</div>
        <div class="mc-desc">高效记忆雅思高频词汇，分组学习与复习</div>
      </a>
      <a href="questions.html" class="module-card">
        <div class="icon">📝</div>
        <div class="mc-title">真题练习</div>
        <div class="mc-desc">雅思阅读、听力真题训练，即时反馈解析</div>
      </a>
      <a href="speaking.html" class="module-card">
        <div class="icon">🎤</div>
        <div class="mc-title">口语练习</div>
        <div class="mc-desc">Part 1/2/3 话题训练，录音回放与AI评分</div>
      </a>
      <a href="writing.html" class="module-card">
        <div class="icon">✍️</div>
        <div class="mc-title">写作练习</div>
        <div class="mc-desc">大作文小作文训练，范文参考与AI批改</div>
      </a>
    </div>

    <!-- 学习统计 -->
    <h2 class="section-title">📊 我的学习统计</h2>
    <div class="stats-grid" id="statsGrid">
      <div class="stat-card stat-blue">
        <div class="num" id="statWordsTotal">0</div>
        <div class="label">总单词数</div>
      </div>
      <div class="stat-card stat-green">
        <div class="num" id="statWordsKnown">0</div>
        <div class="label">已掌握</div>
      </div>
      <div class="stat-card stat-yellow">
        <div class="num" id="statAnswered">0</div>
        <div class="label">答题数</div>
      </div>
      <div class="stat-card stat-purple">
        <div class="num" id="statAccuracy">0%</div>
        <div class="label">正确率</div>
      </div>
      <div class="stat-card stat-pink">
        <div class="num" id="statCheckins">0</div>
        <div class="label">打卡天数</div>
      </div>
    </div>

    <!-- 任务列表 & AI助手 -->
    <div class="content-row" style="margin-top:24px;">
      <div class="panel">
        <h2 class="section-title">📋 我的任务</h2>
        <div id="tasksList">
          <div class="loading-text">加载任务中...</div>
        </div>
      </div>
      <div class="panel">
        <h2 class="section-title">🤖 学习助手</h2>
        <a href="learning.html#ai" class="module-card" style="display:block; text-decoration:none; padding:20px; background:linear-gradient(135deg,#dbeafe 0%,#e0e7ff 100%); border-radius:12px;">
          <div class="icon" style="font-size:32px;">💡</div>
          <div class="mc-title" style="color:#1e3a8a; font-size:16px;">AI 学习助手</div>
          <div class="mc-desc">与AI对话，解决学习疑问，获取个性化建议</div>
        </a>
        <div style="margin-top:16px;">
          <button class="btn-primary" style="width:100%;" onclick="doCheckin()">✅ 今日打卡</button>
        </div>
        <div style="margin-top:12px;">
          <button class="btn-secondary" style="width:100%;" onclick="window.location.href='learning.html'">📈 查看学习中心</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    let currentUser = null;

    function checkAuth() {
      fetch('/api/me').then(r => r.json()).then(data => {
        if (!data.username) {
          window.location.href = 'login.html';
          return;
        }
        if (data.role === 'admin') {
          window.location.href = 'admin.html';
          return;
        }
        currentUser = data;
        document.getElementById('username').textContent = '👋 ' + data.username;
        const bb = document.getElementById('backBtn');
        if (bb) {
          if (data.role === 'admin') {
            bb.href = 'admin.html';
            bb.textContent = '← 管理员主页';
            bb.style.background = '#7c3aed';
          } else {
            bb.href = 'dashboard.html';
            bb.textContent = '← 返回首页';
            bb.style.background = '#2563eb';
          }
        }
        loadStats();
        loadTasks();
      }).catch(() => {
        window.location.href = 'login.html';
      });
    }

    function logout() {
      fetch('/api/logout', { method: 'POST' }).then(() => {
        window.location.href = 'login.html';
      });
    }

    function loadStats() {
      fetch('/api/stats/overview').then(r => r.json()).then(res => {
        if (res.success) {
          const d = res.data;
          document.getElementById('statWordsTotal').textContent = d.words.total;
          document.getElementById('statWordsKnown').textContent = d.words.known;
          document.getElementById('statAnswered').textContent = d.questions.answered;
          document.getElementById('statAccuracy').textContent = d.questions.accuracy + '%';
          document.getElementById('statCheckins').textContent = d.checkins.total;
        }
      });
    }

    function loadTasks() {
      fetch('/api/tasks').then(r => r.json()).then(res => {
        const container = document.getElementById('tasksList');
        if (!res.success || !res.data || res.data.length === 0) {
          container.innerHTML = '<div class="empty-state">暂无任务</div>';
          return;
        }
        container.innerHTML = res.data.slice(0, 5).map(t => `
          <div class="task-card ${t.status === 'completed' ? 'task-done' : 'task-pending'}" style="margin-bottom:12px;">
            <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:12px;">
              <div style="flex:1;">
                <div class="task-title" style="font-size:15px; font-weight:600; color:#1f2937; margin-bottom:4px;">${t.title}</div>
                <div class="task-meta" style="font-size:12px; color:#6b7280;">
                  <span style="background:#e0e7ff; color:#3730a3; padding:2px 8px; border-radius:4px; margin-right:8px;">${t.module || '通用'}</span>
                  <span style="background:${t.status === 'completed' ? '#d1fae5' : '#fef3c7'}; color:${t.status === 'completed' ? '#065f46' : '#92400e'}; padding:2px 8px; border-radius:4px;">
                    ${t.status === 'completed' ? '✅ 已完成' : '⏳ 进行中'}
                  </span>
                </div>
              </div>
            </div>
          </div>
        `).join('');
      }).catch(() => {
        document.getElementById('tasksList').innerHTML = '<div class="empty-state">加载失败</div>';
      });
    }

    function doCheckin() {
      fetch('/api/checkin').then(r => r.json()).then(res => {
        if (res.success) {
          showToast(res.alreadyChecked ? '今日已打卡 ✓' : '打卡成功！🎉 累计 ' + (res.totalCheckins || 0) + ' 天', 'success');
          loadStats();
        } else {
          showToast(res.message || '打卡失败', 'error');
        }
      });
    }

    function showToast(msg, type) {
      const t = document.createElement('div');
      t.className = 'toast ' + (type === 'success' ? 'toast-success' : (type === 'error' ? 'toast-error' : 'toast-info'));
      t.textContent = msg;
      document.body.appendChild(t);
      setTimeout(() => t.remove(), 2500);
    }

    checkAuth();
  </script>
</body>
</html>
