<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>学习中心 - 雅思学习空间</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <div class="page-container">
    <div class="page-topbar">
      <div class="brand">📊 学习中心</div>
      <div class="right-group">
        <span id="username" class="username"></span>
        <button class="logout-btn" onclick="logout()">退出登录</button>
      </div>
    </div>

    <div style="margin-bottom: 12px;"><a href="dashboard.html" style="display:inline-block;padding:8px 16px;background:#2563eb;color:#fff;border-radius:6px;text-decoration:none;font-size:14px;">← 返回首页</a></div>
    <h1 class="page-title">📊 学习中心</h1>
    <p class="page-subtitle">学习统计、打卡日历、AI 学习助手一站式管理</p>

    <!-- 导航标签 -->
    <div style="display:flex; gap:8px; margin-bottom:24px; flex-wrap:wrap;">
      <button class="tab-btn active" onclick="switchTab('stats', this)">📈 学习统计</button>
      <button class="tab-btn" onclick="switchTab('checkin', this)">📅 打卡日历</button>
      <button class="tab-btn" onclick="switchTab('ai', this)">🤖 AI 助手</button>
    </div>

    <!-- 统计 Tab -->
    <div id="tab-stats" class="tab-content" style="display:block;">
      <div class="panel" style="margin-bottom:24px;">
        <h2 class="section-title">📊 总体学习概览</h2>
        <div id="overviewStats">
          <div class="loading-text">加载中...</div>
        </div>
      </div>

      <div class="panel" style="margin-bottom:24px;">
        <h2 class="section-title">📈 每日学习时长 (最近30天)</h2>
        <div style="position:relative; height:300px; padding:20px;">
          <canvas id="dailyChart"></canvas>
        </div>
      </div>

      <div class="panel" style="margin-bottom:24px;">
        <h2 class="section-title">🎯 各模块学习分布</h2>
        <div style="position:relative; height:300px; padding:20px;">
          <canvas id="modulesChart"></canvas>
        </div>
      </div>

      <div class="panel">
        <h2 class="section-title">✅ 打卡记录</h2>
        <div style="position:relative; height:260px; padding:20px;">
          <canvas id="checkinChart"></canvas>
        </div>
      </div>
    </div>

    <!-- 打卡 Tab -->
    <div id="tab-checkin" class="tab-content" style="display:none;">
      <div class="panel" style="margin-bottom:24px;">
        <h2 class="section-title">📅 今日打卡</h2>
        <div style="text-align:center; padding:24px;">
          <div style="font-size:48px; margin-bottom:16px;">🔥</div>
          <button class="btn-primary" style="padding:16px 32px; font-size:16px;" onclick="doCheckin()">立即打卡</button>
          <div id="checkinStatus" style="margin-top:16px; color:#6b7280; font-size:14px;"></div>
        </div>
      </div>

      <div class="panel">
        <h2 class="section-title">📜 打卡日历 (最近30天)</h2>
        <div id="calendarGrid" style="display:grid; grid-template-columns:repeat(auto-fit, minmax(36px, 1fr)); gap:6px; margin-top:16px;">
          <div class="loading-text">加载中...</div>
        </div>
        <div style="margin-top:16px; display:flex; gap:12px; justify-content:center; flex-wrap:wrap; font-size:13px; color:#6b7280;">
          <span style="display:flex; align-items:center; gap:6px;"><span style="display:inline-block; width:16px; height:16px; background:#e5e7eb; border-radius:3px;"></span>未打卡</span>
          <span style="display:flex; align-items:center; gap:6px;"><span style="display:inline-block; width:16px; height:16px; background:#10b981; border-radius:3px;"></span>已打卡</span>
        </div>
      </div>
    </div>

    <!-- AI 聊天 Tab -->
    <div id="tab-ai" class="tab-content" style="display:none;">
      <div class="panel" style="height:calc(100vh - 260px); min-height:500px; display:flex; flex-direction:column;">
        <h2 class="section-title" style="flex-shrink:0;">🤖 AI 学习助手</h2>
        <p style="color:#6b7280; font-size:13px; margin-bottom:12px; flex-shrink:0;">向 AI 提问关于英语学习、雅思备考、语法讲解等问题。</p>

        <div id="chatMessages" style="flex:1; overflow-y:auto; padding:12px; background:#f9fafb; border-radius:10px; margin-bottom:12px; min-height:300px;">
          <div style="text-align:center; color:#6b7280; font-size:14px; padding:20px;">
            👋 您好！我是您的雅思学习助手。有任何学习问题都可以问我！
            <div style="margin-top:12px; font-size:12px; color:#9ca3af;">示例问题: "如何提高雅思写作分数？" / "请讲解现在完成时的用法"</div>
          </div>
        </div>

        <div style="display:flex; gap:10px; flex-shrink:0;">
          <input type="text" id="chatInput" placeholder="输入您的问题..." style="flex:1; padding:12px 14px; border:1.5px solid #d1d5db; border-radius:8px; font-size:14px; outline:none;" onkeypress="if(event.key==='Enter') sendChat()">
          <button class="btn-primary" onclick="sendChat()">发送</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    let currentUser = null;
    let charts = {};

    function checkAuth() {
      fetch('/api/me').then(r => r.json()).then(data => {
        if (!data.username) { window.location.href = 'login.html'; return; }
        currentUser = data;
        document.getElementById('username').textContent = '👋 ' + data.username;
        initAll();
      }).catch(() => { window.location.href = 'login.html'; });
    }

    function logout() {
      fetch('/api/logout', { method: 'POST' }).then(() => { window.location.href = 'login.html'; });
    }

    function switchTab(tab, btn) {
      document.querySelectorAll('.tab-content').forEach(t => t.style.display = 'none');
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.getElementById('tab-' + tab).style.display = 'block';
      btn.classList.add('active');
      if (tab === 'stats' && !charts.initialized) setTimeout(loadStatsCharts, 100);
      if (tab === 'checkin') loadCalendar();
    }

    function initAll() {
      loadOverview();
    }

    function loadOverview() {
      fetch('/api/stats/overview').then(r => r.json()).then(res => {
        if (res.success && res.data) {
          const d = res.data;
          const container = document.getElementById('overviewStats');
          container.innerHTML = `
            <div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(160px, 1fr)); gap:16px;">
              <div style="background:linear-gradient(135deg,#eff6ff 0%,#dbeafe 100%); padding:20px; border-radius:12px; border-left:4px solid #2563eb; text-align:center;">
                <div style="font-size:28px; font-weight:700; color:#1e40af;">${d.words.total}</div>
                <div style="font-size:13px; color:#6b7280; margin-top:4px;">总单词数</div>
              </div>
              <div style="background:linear-gradient(135deg,#ecfdf5 0%,#d1fae5 100%); padding:20px; border-radius:12px; border-left:4px solid #10b981; text-align:center;">
                <div style="font-size:28px; font-weight:700; color:#065f46;">${d.words.known}</div>
                <div style="font-size:13px; color:#6b7280; margin-top:4px;">已掌握单词</div>
              </div>
              <div style="background:linear-gradient(135deg,#fffbeb 0%,#fef3c7 100%); padding:20px; border-radius:12px; border-left:4px solid #f59e0b; text-align:center;">
                <div style="font-size:28px; font-weight:700; color:#92400e;">${d.questions.answered}</div>
                <div style="font-size:13px; color:#6b7280; margin-top:4px;">答题数</div>
              </div>
              <div style="background:linear-gradient(135deg,#faf5ff 0%,#f3e8ff 100%); padding:20px; border-radius:12px; border-left:4px solid #9333ea; text-align:center;">
                <div style="font-size:28px; font-weight:700; color:#7e22ce;">${d.questions.accuracy}%</div>
                <div style="font-size:13px; color:#6b7280; margin-top:4px;">正确率</div>
              </div>
              <div style="background:linear-gradient(135deg,#fff1f2 0%,#ffe4e6 100%); padding:20px; border-radius:12px; border-left:4px solid #e11d48; text-align:center;">
                <div style="font-size:28px; font-weight:700; color:#9f1239;">${d.checkins.total}</div>
                <div style="font-size:13px; color:#6b7280; margin-top:4px;">累计打卡</div>
              </div>
              <div style="background:linear-gradient(135deg,#f0fdf4 0%,#dcfce7 100%); padding:20px; border-radius:12px; border-left:4px solid #22c55e; text-align:center;">
                <div style="font-size:28px; font-weight:700; color:#166534;">${d.tasks.total}</div>
                <div style="font-size:13px; color:#6b7280; margin-top:4px;">分配任务 (${d.tasks.completed}已完成)</div>
              </div>
            </div>
            <div style="margin-top:16px; font-size:13px; color:${d.ai_configured ? '#10b981' : '#f59e0b'}; padding:10px; background:${d.ai_configured ? '#ecfdf5' : '#fffbeb'}; border-radius:8px; border-left:3px solid ${d.ai_configured ? '#10b981' : '#f59e0b'};">
              ${d.ai_configured ? '✅ AI 服务已配置，可使用 AI 学习助手和评分功能' : '⚠️ AI 服务尚未配置 (请联系管理员设置)'}
            </div>
          `;
        }
      });
    }

    function loadStatsCharts() {
      if (charts.initialized) return;
      charts.initialized = true;

      fetch('/api/stats/chart?type=daily').then(r => r.json()).then(res => {
        if (res.success && res.data) {
          const labels = res.data.map(d => {
            const s = String(d.day || '').slice(5);
            return s || '-';
          });
          const counts = res.data.map(d => d.count || 0);
          new Chart(document.getElementById('dailyChart'), {
            type: 'line',
            data: {
              labels: labels,
              datasets: [{
                label: '学习次数',
                data: counts,
                borderColor: '#2563eb',
                backgroundColor: 'rgba(37,99,235,0.1)',
                fill: true,
                tension: 0.3,
                pointRadius: 4,
                pointBackgroundColor: '#2563eb'
              }]
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              plugins: { legend: { display: true, position: 'top' } },
              scales: { y: { beginAtZero: true } }
            }
          });
        }
      });

      fetch('/api/stats/chart?type=study').then(r => r.json()).then(res => {
        if (res.success && res.data) {
          const labels = res.data.map(d => d.module);
          const counts = res.data.map(d => d.count || 0);
          const colors = ['#2563eb', '#10b981', '#f59e0b', '#9333ea', '#e11d48'];
          new Chart(document.getElementById('modulesChart'), {
            type: 'doughnut',
            data: {
              labels: labels,
              datasets: [{
                data: counts,
                backgroundColor: colors.slice(0, labels.length),
                borderWidth: 2,
                borderColor: '#fff'
              }]
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              plugins: { legend: { position: 'right' } }
            }
          });
        }
      });

      fetch('/api/stats/chart?type=checkin').then(r => r.json()).then(res => {
        if (res.success && res.data) {
          const labels = res.data.map(d => String(d.date || '').slice(5));
          const counts = res.data.map(d => d.count || 0);
          new Chart(document.getElementById('checkinChart'), {
            type: 'bar',
            data: {
              labels: labels,
              datasets: [{
                label: '打卡',
                data: counts,
                backgroundColor: 'rgba(16,185,129,0.7)',
                borderColor: '#10b981',
                borderWidth: 1
              }]
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              plugins: { legend: { display: false } },
              scales: { y: { beginAtZero: true, ticks: { stepSize: 1 } } }
            }
          });
        }
      });
    }

    function loadCalendar() {
      fetch('/api/checkins').then(r => r.json()).then(res => {
        const container = document.getElementById('calendarGrid');
        if (!res.success || !res.data || res.data.length === 0) {
          container.innerHTML = '<div class="empty-state" style="grid-column:1/-1;">暂无打卡记录，点击上方按钮开始第一次打卡！</div>';
          return;
        }
        const checkinDates = new Set(res.data.map(d => String(d.date)));
        const today = new Date();
        const days = [];
        for (let i = 29; i >= 0; i--) {
          const d = new Date(today);
          d.setDate(d.getDate() - i);
          const dateStr = d.toISOString().slice(0, 10);
          days.push({ date: dateStr, checked: checkinDates.has(dateStr), label: d.getDate() });
        }
        container.innerHTML = days.map(d => `
          <div style="aspect-ratio:1; background:${d.checked ? '#10b981' : '#e5e7eb'}; border-radius:6px; display:flex; align-items:center; justify-content:center; font-size:11px; color:${d.checked ? '#fff' : '#6b7280'}; font-weight:${d.checked ? '700' : '400'};" title="${d.date}${d.checked ? ' ✓ 已打卡' : ''}">
            ${d.label}
          </div>
        `).join('');
      });
    }

    function doCheckin() {
      fetch('/api/checkin').then(r => r.json()).then(res => {
        if (res.success) {
          document.getElementById('checkinStatus').innerHTML = `<span style="color:#10b981; font-weight:600;">${res.alreadyChecked ? '今日已打卡 ✓' : '打卡成功！🎉'}${res.totalCheckins !== undefined ? ' 累计 ' + res.totalCheckins + ' 天' : ''}</span>`;
          showToast(res.alreadyChecked ? '今日已打卡' : '打卡成功！', 'success');
          loadCalendar();
          loadOverview();
        } else {
          document.getElementById('checkinStatus').innerHTML = `<span style="color:#ef4444;">${escapeHtml(res.message || '打卡失败')}</span>`;
        }
      });
    }

    function sendChat() {
      const input = document.getElementById('chatInput');
      const text = input.value.trim();
      if (!text) return;
      const messages = document.getElementById('chatMessages');
      messages.innerHTML += `
        <div style="display:flex; justify-content:flex-end; margin-bottom:12px;">
          <div style="background:#2563eb; color:#fff; padding:10px 14px; border-radius:12px 12px 2px 12px; max-width:70%; font-size:14px; line-height:1.6;">
            ${escapeHtml(text)}
          </div>
        </div>
      `;
      input.value = '';
      messages.scrollTop = messages.scrollHeight;
      const loadingId = 'loading-' + Date.now();
      messages.innerHTML += `
        <div id="${loadingId}" style="display:flex; justify-content:flex-start; margin-bottom:12px;">
          <div style="background:#fff; color:#6b7280; padding:10px 14px; border-radius:12px 12px 12px 2px; font-size:14px; border:1px solid #e5e7eb;">
            🤖 AI 正在思考...
          </div>
        </div>
      `;
      messages.scrollTop = messages.scrollHeight;
      fetch('/api/ai/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ question: text })
      }).then(r => r.json()).then(res => {
        const loading = document.getElementById(loadingId);
        if (loading) loading.remove();
        if (res.success && res.data) {
          const answer = res.data.answer || '(空回答)';
          messages.innerHTML += `
            <div style="display:flex; justify-content:flex-start; margin-bottom:12px;">
              <div style="background:#fff; color:#1f2937; padding:12px 16px; border-radius:12px 12px 12px 2px; font-size:14px; line-height:1.7; border:1px solid #e5e7eb; max-width:80%; white-space:pre-wrap;">
                <div style="font-weight:600; color:#2563eb; margin-bottom:6px;">🤖 AI 助手</div>
                ${escapeHtml(answer)}
              </div>
            </div>
          `;
        } else {
          messages.innerHTML += `
            <div style="display:flex; justify-content:flex-start; margin-bottom:12px;">
              <div style="background:#fff; color:#991b1b; padding:12px 16px; border-radius:12px 12px 12px 2px; font-size:14px; line-height:1.6; border:1px solid #fecaca; max-width:80%;">
                ❌ ${escapeHtml(res.message || '请求失败，请稍后重试')}
              </div>
            </div>
          `;
        }
        messages.scrollTop = messages.scrollHeight;
      }).catch(() => {
        const loading = document.getElementById(loadingId);
        if (loading) loading.remove();
        messages.innerHTML += `<div style="color:#ef4444; font-size:13px; text-align:center; margin-bottom:12px;">请求错误</div>`;
      });
    }

    function escapeHtml(str) {
      if (str === null || str === undefined) return '';
      return String(str).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    function showToast(msg, type) {
      const t = document.createElement('div');
      t.className = 'toast ' + (type === 'success' ? 'toast-success' : (type === 'error' ? 'toast-error' : 'toast-info'));
      t.textContent = msg;
      document.body.appendChild(t);
      setTimeout(() => t.remove(), 2500);
    }

    checkAuth();
  </script>

  <style>
    .tab-btn {
      background: #fff;
      color: #374151;
      border: 1.5px solid #d1d5db;
      padding: 10px 20px;
      border-radius: 8px;
      font-size: 14px;
      cursor: pointer;
      font-weight: 500;
      transition: all 0.2s;
    }
    .tab-btn:hover {
      background: #f3f4f6;
      border-color: #9ca3af;
    }
    .tab-btn.active {
      background: #2563eb;
      color: #fff;
      border-color: #2563eb;
    }
    .tab-content {
      animation: fadeIn 0.3s;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</body>
</html>
